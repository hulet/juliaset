<!DOCTYPE html>
<html lang="en">
<head>
    <title>hulet.org</title>
    <meta charset="UTF-8">
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='description' content='hulet.org'>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111'/><circle cx='16' cy='16' r='12' fill='none' stroke='%23ff8c00' stroke-width='2'/><circle cx='16' cy='16' r='6' fill='none' stroke='%2320cbd8' stroke-width='1.5'/></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* Basic reset and fullscreen styles */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevent scrollbars */
            background-color: #111;
        }

        #app {
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div id='app'>
        <canvas id='canvas'></canvas>
    </div>

    <script type="x-shader/x-fragment" id="fs">
    // Fragment Shader for rendering the Julia set
    uniform vec2 size, range, center; // Removed 'mouse' as it's no longer needed here
    uniform vec2 c_julia; // The constant 'c' for the Julia set calculation
    uniform float mouseRange, shadow, d;
    uniform int maxItr;
    uniform vec4 c[5];

    // Calculates the escape time for a point in the complex plane
    float julia(vec2 z, vec2 c_param) {
        int i;
        for(int itr=0; itr<2048; itr++){ // Increased max iterations for detail
            i = itr;
            if(dot(z, z) >= 65536. || itr >= maxItr) break;

            // z = z^2 + c
            float x_tmp = z.x*z.x - z.y*z.y + c_param.x;
            z.y = 2.*z.x*z.y + c_param.y;
            z.x = x_tmp;
        }

        // Smooth coloring algorithm
        float nu = 0.0;
        if(i < maxItr){
            float log_zn = log(dot(z, z)) * 0.5;
            nu = log(log_zn / log(2.0))/log(2.0);
        }

        return (float(i+1)-nu)/float(maxItr);
    }

    // Smoothstep function for color interpolation
    float smoothf(float x) {
        return smoothstep(0., 1., x);
    }

    // Maps a value to a color using the defined color palette
    vec4 color(float x) {
        if(x < c[1].a){
            return mix(c[0], c[1], smoothf((x-c[0].a)/(c[1].a-c[0].a)));
        }else if(x < c[2].a){
            return mix(c[1], c[2], smoothf((x-c[1].a)/(c[2].a-c[1].a)));
        }else if(x < c[3].a){
            return mix(c[2], c[3], smoothf((x-c[2].a)/(c[3].a-c[2].a)));
        }else if(x < c[4].a){
            return mix(c[3], c[4], smoothf((x-c[3].a)/(c[4].a-c[3].a)));
        }else{
            return mix(c[4], c[0], smoothf((x-c[4].a)/(1.0-c[4].a)));
        }
    }

    // Applies shadow and tiling to the color
    vec4 pattern(float f) {
        f = pow(f, shadow);
        return color(mod(f, 1./d)*d);
    }

    void main() {
        // Determine the correct aspect ratio for the view
        float r = size.x*range.y > range.x*size.y ? range.y/size.y : range.x/size.x;
        
        // Map the fragment coordinate to the complex plane, including the center offset for panning
        vec2 z = center + (gl_FragCoord.xy - 0.5*size)*r;
        
        // The 'c' parameter is now passed in directly via the c_julia uniform.
        // It does NOT change when zooming.

        // Simple anti-aliasing by sampling neighbors
        float dl = r * 0.5; 
        vec4 col = vec4(0.);
        col += pattern(julia(z+vec2(dl*0., dl*0.), c_julia));
        col += pattern(julia(z+vec2(dl*0., dl*1.), c_julia));
        col += pattern(julia(z+vec2(dl*1., dl*0.), c_julia));
        col += pattern(julia(z+vec2(dl*1., dl*1.), c_julia));
        col *= 0.25;

        gl_FragColor = col;
    }
    </script>

    <script>
    (function () {
        'use strict';

        const state = {
            canvas: null,
            renderer: null,
            scene: null,
            camera: null,
            mouse: true,
            dirty: true,
            originalRange: new THREE.Vector2(3.5, 2.5),
            uniforms: {
                range:      { value: new THREE.Vector2(3.5, 2.5) },
                center:     { value: new THREE.Vector2(0.0, 0.0) },
                c_julia:    { value: new THREE.Vector2(-0.4, 0.6) },
                size:       { value: new THREE.Vector2(0.0, 0.0) },
                maxItr:     { value: 128 },
                mouseRange: { value: 0.7 },
                shadow:     { value: 1.0 },
                d:          { value: 5.0 },
                c: {
                    value: [
                        new THREE.Vector4(  0. / 255.,   7. / 255.,  30. / 255., 0.0),
                        new THREE.Vector4( 32. / 255., 107. / 255., 203. / 255., 0.16),
                        new THREE.Vector4(237. / 255., 255. / 255., 255. / 255., 0.42),
                        new THREE.Vector4(255. / 255., 140. / 255.,   0. / 255., 0.6425),
                        new THREE.Vector4(  0. / 255.,   2. / 255.,   0. / 255., 0.8575),
                    ],
                },
            },
        };

        function scaleR(size, range) {
            return size.x * range.y > range.x * size.y
                ? range.y / size.y
                : range.x / size.x;
        }

        function draw() {
            state.renderer.render(state.scene, state.camera);
        }

        function frameLoop() {
            if (state.dirty) {
                state.dirty = false;
                draw();
            }
            requestAnimationFrame(frameLoop);
        }

        function onMouseDown() {
            state.mouse = !state.mouse;
            if (state.mouse) {
                state.uniforms.range.value.copy(state.originalRange);
                state.uniforms.center.value.set(0, 0);
            }
            state.dirty = true;
        }

        function onMouseWheel(event) {
            if (state.mouse) return;
            event.preventDefault();

            const zoomFactor = 1.1;
            const size = state.uniforms.size.value;
            const range_before = state.uniforms.range.value;
            const center_before = state.uniforms.center.value;

            const mousePx = new THREE.Vector2(event.offsetX, state.canvas.height - event.offsetY);
            const r_before = scaleR(size, range_before);
            const vec_from_center_px = new THREE.Vector2().subVectors(
                mousePx,
                new THREE.Vector2(size.x * 0.5, size.y * 0.5)
            );
            const mouse_complex_before = new THREE.Vector2()
                .copy(center_before)
                .add(vec_from_center_px.clone().multiplyScalar(r_before));

            const new_range = new THREE.Vector2().copy(range_before);
            if (event.deltaY < 0) {
                new_range.divideScalar(zoomFactor);
            } else {
                new_range.multiplyScalar(zoomFactor);
            }

            new_range.x = Math.min(state.originalRange.x, new_range.x);
            new_range.y = Math.min(state.originalRange.y, new_range.y);

            const r_after = scaleR(size, new_range);
            const new_center = new THREE.Vector2()
                .copy(mouse_complex_before)
                .sub(vec_from_center_px.clone().multiplyScalar(r_after));

            state.uniforms.range.value.copy(new_range);
            state.uniforms.center.value.copy(new_center);
            state.dirty = true;
        }

        function onMouseMove(event) {
            if (!state.mouse) return;
            const size = state.uniforms.size.value;
            const range = state.uniforms.range.value;
            const r = scaleR(size, range);
            const mousePx = new THREE.Vector2(event.offsetX, state.canvas.height - event.offsetY);
            const centerPx = new THREE.Vector2(size.x * 0.5, size.y * 0.5);
            const c_val = new THREE.Vector2()
                .subVectors(mousePx, centerPx)
                .multiplyScalar(r * state.uniforms.mouseRange.value);
            state.uniforms.c_julia.value.copy(c_val);
            state.dirty = true;
        }

        function onTouchMove(event) {
            if (!state.mouse) return;
            const size = state.uniforms.size.value;
            const range = state.uniforms.range.value;
            const r = scaleR(size, range);
            const touchPx = new THREE.Vector2(
                event.targetTouches[0].clientX,
                state.canvas.height - event.targetTouches[0].clientY
            );
            const centerPx = new THREE.Vector2(size.x * 0.5, size.y * 0.5);
            const c_val = new THREE.Vector2()
                .subVectors(touchPx, centerPx)
                .multiplyScalar(r * state.uniforms.mouseRange.value);
            state.uniforms.c_julia.value.copy(c_val);
            state.dirty = true;
        }

        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            state.renderer.setSize(w, h);
            state.uniforms.size.value.x = w;
            state.uniforms.size.value.y = h;
            state.dirty = true;
        }

        function init() {
            state.canvas = document.getElementById('canvas');
            state.renderer = new THREE.WebGLRenderer({ canvas: state.canvas, antialias: true });
            state.scene = new THREE.Scene();
            state.camera = new THREE.OrthographicCamera(-0.5, 0.5, 0.5, -0.5, -1, 1);
            state.scene.add(state.camera);

            const material = new THREE.ShaderMaterial({
                fragmentShader: document.getElementById('fs').textContent,
                uniforms: state.uniforms,
            });
            const plane = new THREE.PlaneGeometry(1.0, 1.0);
            const mesh = new THREE.Mesh(plane, material);
            state.scene.add(mesh);

            window.addEventListener('resize', onResize);
            state.canvas.addEventListener('wheel', onMouseWheel, { passive: false });
            state.canvas.addEventListener('mousedown', onMouseDown);
            state.canvas.addEventListener('mousemove', onMouseMove);
            state.canvas.addEventListener('touchmove', onTouchMove);

            onResize();
            requestAnimationFrame(frameLoop);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
